name: Release Onward

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.45). Defaults to the selected branch/tag.'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Stage installer
        shell: bash
        run: |
          mkdir -p install
          cp dist/Onward-*.dmg dist/Onward-*.exe dist/Onward-*.msix install/ 2>/dev/null || true
          ls -la install/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: install/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Onward ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/**/Onward-*.dmg
            artifacts/**/Onward-*.exe
            artifacts/**/Onward-*.msix
          token: ${{ secrets.GITHUB_TOKEN }}
